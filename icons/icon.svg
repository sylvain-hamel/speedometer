<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Purely geometric: no text, so it rasterises identically on any machine
       regardless of which fonts happen to be installed. Full-bleed background
       so the same file works as a maskable icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- gauge track -->
  <path d="M 121.8 345.5 A 155 155 0 1 1 390.2 345.5"
        fill="none" stroke="#48484A" stroke-width="38" stroke-linecap="round"/>

  <!-- the slow end of the scale, lit up: this is a trolling gauge -->
  <path d="M 121.8 345.5 A 155 155 0 0 1 108.6 220.1"
        fill="none" stroke="#30D158" stroke-width="38" stroke-linecap="round"/>

  <!-- needle sitting low in the range -->
  <line x1="256" y1="268" x2="141.9" y2="230.9"
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="268" r="28" fill="#FFFFFF"/>
  <circle cx="256" cy="268" r="11" fill="#000000"/>
</svg>
